[package]
name = "turk-router"
version = "0.0.0"
description = "Builds the find_route instruction for the Turk Router program."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published yet: the first release waits for the venue modules and the
# builder to be measured against the deployed program.
publish = false

[dependencies]
# Instruction and AccountMeta, nothing else.
solana-instruction = "3"
# curve25519: Pubkey::find_program_address for the config account and the fee
# wallet's token account, both derived offline.
solana-pubkey = { version = "4", features = ["curve25519"] }

[dev-dependencies]
# Only the tests read the manifest; nothing this crate publishes depends on a
# JSON parser.
serde_json = "1"
# Recomputes the instruction discriminator from its name so a typo in the
# constant cannot ship.
sha2 = "0.11"
# Mirror structs for clients/golden/find_route.json, the corpus both clients
# verify. Test-only, like serde_json above.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
