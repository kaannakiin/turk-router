# No job here reaches the network for anything but its package registry, and
# this repository holds no secret. Both are deliberate: it takes pull requests
# from people who do not own it, and GitHub withholds secrets from a fork's
# pull request, so any check that needed one would silently skip for exactly
# the contributors whose changes need checking most.
#
# That is why the wire contract arrives as a committed file. When the deployed
# program's wire moves, its own repository opens a pull request here carrying the
# new wire/wire-manifest.json, and the tests below then hold every client
# constant against it. Nothing here reaches out to fetch it.
#
# Actions are pinned by commit SHA, because a tag can be moved by whoever owns
# the action.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Catches the ecosystem moving under a tree nobody has touched: a new clippy
  # lint, a yanked dependency.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the channel; rustup picks it up from the repo root.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt
        run: cargo fmt --all --check
      # --locked because a client that resolves a different dependency tree than
      # the one committed is not the client anybody reviewed.
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # manifest_agreement.rs is the wire gate: it holds every constant the
      # clients declare against the committed wire/wire-manifest.json.
      - name: test
        run: cargo test --workspace --locked
      # A broken intra-doc link or a missing doc is a defect in the API contract,
      # and docs.rs is too late to learn about it.
      - name: doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The TypeScript client, held to the Rust one by clients/golden/find_route.json:
  # the rust job verifies that file against what the Rust client emits, this job
  # against what the TypeScript client emits, so the two cannot drift apart
  # without one of them turning red.
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor package.json declares; testing on it is what proves it.
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      # --ignore-scripts: nothing in the tree needs a lifecycle script (esbuild
      # and the native binaries resolve from optionalDependencies), and a
      # dependency that gained one would otherwise run code on every fork's
      # pull request.
      - name: install
        run: npm ci --ignore-scripts
      # Format, lint, typecheck (which compiles tests/types.typecheck.ts, the
      # compile-fail proofs), test, build, and a pack dry-run listing what a
      # tarball would carry.
      - name: check
        run: npm run check

  # A pull request can add a dependency as easily as a line of code, and this repository takes
  # them from people who do not own it. Both lockfiles are held to their public registry, so a
  # package fetched from anywhere else is refused here rather than noticed later. No secret, so it
  # runs on a fork's pull request too.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: every npm dependency is fetched from registry.npmjs.org
        run: |
          hosts=$(grep -o '"resolved": *"[^"]*"' clients/ts/package-lock.json \
            | sed 's/.*"resolved": *"//' \
            | sed 's|\(^[a-z][a-z0-9+.-]*://[^/]*\).*|\1|' \
            | sort -u | grep -v '^https://registry.npmjs.org$' || true)
          if [ -n "$hosts" ]; then
            echo "::error::a dependency is fetched from outside the public npm registry:"
            echo "$hosts"
            exit 1
          fi

      - name: every cargo dependency is fetched from crates.io
        run: |
          sources=$(grep -o '^source = "[^"]*"' Cargo.lock | sed 's/^source = "//; s/"$//' \
            | sort -u | grep -v '^registry+https://github.com/rust-lang/crates.io-index$' || true)
          if [ -n "$sources" ]; then
            echo "::error::a crate is fetched from outside crates.io:"
            echo "$sources"
            exit 1
          fi
